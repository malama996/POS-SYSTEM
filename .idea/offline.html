<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - ShopPOS</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      max-width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    h1 {
      margin-bottom: 10px;
      font-size: 20px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
    }
    button {
      margin-top: 16px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #10b981;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📴 You're Offline</h1>
    <p>ShopPOS can't load new data right now.</p>
    <p>But your saved data will still work once the app loads.</p>

    <button onclick="location.reload()">🔄 Try Again</button>
  </div>
</body>
</html>
