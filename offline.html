<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ShopPOS — Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9}
body{display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.wrap{max-width:380px;width:100%}
.icon{width:80px;height:80px;margin:0 auto 24px;background:rgba(16,185,129,.12);border-radius:50%;display:flex;align-items:center;justify-content:center}
.icon svg{width:40px;height:40px;stroke:#10b981;fill:none;stroke-width:1.5}
h1{font-size:22px;font-weight:800;margin-bottom:8px;color:#f1f5f9}
p{font-size:14px;color:#94a3b8;line-height:1.6;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:12px;border:none;background:#10b981;color:#000;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}
.hint{margin-top:32px;font-size:12px;color:#475569;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/></svg>
  </div>
  <h1>You're Offline</h1>
  <p>ShopPOS needs an internet connection for the first load. Once loaded, it works fully offline.</p>
  <button class="btn" onclick="location.reload()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    Try Again
  </button>
  <div class="hint">
    If this keeps happening, check your Wi-Fi or mobile data.<br>
    ShopPOS by ZhenchStacks
  </div>
</div>
</body>
</html>
